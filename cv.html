<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Original curriculum vitae of Md Shifatul Ahsan Apurba.">
  <link rel="icon" type="image/png" href="assets/img/root/favicon.png">
  <link rel="stylesheet" href="site.css">
  <title>CV | Md Shifatul Ahsan Apurba</title>
  <style>
    body{background:#f3f5f4}.cv-toolbar{position:sticky;top:0;z-index:120;background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}
    .cv-toolbar .wrap{min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px}.cv-toolbar strong{color:var(--ink)}.cv-toolbar-actions{display:flex;gap:8px;flex-wrap:wrap}
    .cv-viewer{width:min(1040px,calc(100% - 30px));height:calc(100vh - 92px);min-height:680px;margin:14px auto;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;box-shadow:var(--shadow-sm)}
    .cv-viewer iframe{width:100%;height:100%;border:0}.cv-loading{height:100%;display:grid;place-items:center;color:var(--muted);padding:30px;text-align:center}
    @media(max-width:680px){.cv-toolbar .wrap{align-items:flex-start;flex-direction:column;padding:12px 0}.cv-viewer{height:calc(100vh - 125px);min-height:560px}}
  </style>
</head>
<body>
<div class="cv-toolbar">
  <div class="wrap">
    <div><strong>Md Shifatul Ahsan Apurba</strong><div style="font-size:.8rem;color:var(--muted)">Original CV · PDF</div></div>
    <div class="cv-toolbar-actions"><a class="button" href="./">← Website</a><a class="button primary" id="downloadCV" href="#">Download PDF</a></div>
  </div>
</div>
<main class="cv-viewer" id="viewer"><div class="cv-loading">Loading original CV…</div></main>
<script src="cv-data-1.js"></script><script src="cv-data-2.js"></script><script src="cv-data-3.js"></script><script src="cv-data-4.js"></script>
<script>
(function(){
  try{
    const b64=(window.CV_PARTS||[]).join('');
    const raw=atob(b64); const bytes=new Uint8Array(raw.length);
    for(let i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);
    const blob=new Blob([bytes],{type:'application/pdf'}); const url=URL.createObjectURL(blob);
    const iframe=document.createElement('iframe'); iframe.title='Md Shifatul Ahsan Apurba CV'; iframe.src=url+'#view=FitH';
    const viewer=document.getElementById('viewer'); viewer.innerHTML=''; viewer.appendChild(iframe);
    const dl=document.getElementById('downloadCV'); dl.href=url; dl.download='Md_Shifatul_Ahsan_Apurba_CV.pdf';
  }catch(e){document.getElementById('viewer').innerHTML='<div class="cv-loading">The PDF viewer could not load. Please refresh the page.</div>';}
})();
</script>
</body></html>
